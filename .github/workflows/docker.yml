name: Docker image

on:
  push:
    branches: [version-16, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: invite:latest
      - name: Verify installed apps and frontend
        run: |
          docker run --rm --entrypoint bash invite:latest -ec '
            env/bin/python -c "import frappe, invite"
            grep -qx invite sites/apps.txt
            test -f apps/invite/invite/www/invite.html
            test -d apps/invite/invite/public/frontend
            test -d assets/frappe
          '
